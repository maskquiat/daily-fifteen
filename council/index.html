<title>Council of the Animal Kingdom</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --paper:#fbf6ee; --on-ink:#fbf6ee;
  --a1:#ff4fa3; --a2:#ffd23f; --a3:#1fb5a8; --a4:#7bd23a; --a5:#8a5cf6;
  --on-a1:#141414; --on-a2:#141414; --on-a3:#141414; --on-a4:#141414; --on-a5:#fff;
  --good:#2fae5b; --on-good:#141414; --bad:#e5383b; --on-bad:#fff;
  --focus-x:50%; --focus-y:50%;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --marker:'Permanent Marker', system-ui, sans-serif;
  --r:18px; --bw:3px; --shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:17px;line-height:1.45}
html{overflow-x:hidden}
body{min-height:100dvh;overflow-x:hidden;position:relative}
button,input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 0 120px;position:relative;overflow-x:clip}
.pad{padding:16px}
.art{background-image:var(--theme-img);background-size:cover;background-position:var(--focus-x) var(--focus-y)}
.card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:12px 18px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font-weight:800;font-size:19px;cursor:pointer;transition:transform .06s,box-shadow .06s;letter-spacing:-.01em}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--a1);color:var(--on-a1)}
.btn.alt{background:var(--a2);color:var(--on-a2)}
.btn.small{min-height:40px;font-size:15px;padding:6px 12px;width:auto;box-shadow:3px 3px 0 var(--ink);border-radius:12px}
.btn.ghost{box-shadow:none;background:transparent}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.muted{opacity:.72}
.marker{font-family:var(--marker);font-weight:400}
.field{width:100%;min-height:54px;padding:10px 14px;border:var(--bw) solid var(--ink);border-radius:14px;background:#fff;font-size:19px;font-weight:600;outline:none}
.field:focus{box-shadow:0 0 0 4px var(--a2)}
.error{color:var(--bad);font-weight:700;font-size:15px;min-height:1em}
.hero{position:relative;height:min(62vh,440px);border-bottom:var(--bw) solid var(--ink);overflow:hidden}
.hero .title{position:absolute;left:14px;right:14px;bottom:18px}
.big-title{font-size:clamp(52px,15vw,86px);line-height:.86;font-weight:800;letter-spacing:-.04em;margin:0}
.sticker{display:inline-block;background:var(--paper);border:var(--bw) solid var(--ink);padding:4px 12px 6px;border-radius:14px;box-shadow:var(--shadow)}
.tilt-l{transform:rotate(-3deg)}.tilt-r{transform:rotate(2.5deg)}
.stripes{background:repeating-linear-gradient(135deg,var(--a3) 0 9px,transparent 9px 18px)}
.dots{height:16px;background:radial-gradient(circle at 8px 8px,var(--a4) 6px,transparent 7px) 0 0/26px 16px repeat-x}
.code{font-size:64px;font-weight:800;letter-spacing:.12em;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;background:var(--paper)}
.pdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--a2);font-size:24px;font-weight:800;line-height:1;cursor:pointer}
.stepper .val{min-width:70px;text-align:center;font-size:22px;font-weight:800}
.letters{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.letters button{aspect-ratio:1;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;font-size:16px;cursor:pointer;padding:0}
.letters button.off{background:var(--ink);color:var(--on-ink);text-decoration:line-through;opacity:.85}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:var(--bw) solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
.band{position:relative;height:150px;border-bottom:var(--bw) solid var(--ink)}
.tile{position:absolute;left:16px;bottom:-34px;width:118px;height:118px;border:4px solid var(--ink);border-radius:22px;background:var(--a2);color:var(--on-a2);display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:800;line-height:1;box-shadow:var(--shadow);transform:rotate(-5deg)}
.timer{position:absolute;right:14px;bottom:-26px;min-width:104px;height:72px;padding:0 14px;border:4px solid var(--ink);border-radius:999px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.timer.low{background:var(--bad);color:var(--on-bad);animation:pulse .5s ease-in-out infinite alternate}
.cat{border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin:0 0 16px;background:#fff}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:var(--bw) solid var(--ink)}
.cat-head .marker{font-size:24px}
.cat input{border:0;width:100%;min-height:60px;padding:10px 14px;font-size:22px;font-weight:700;outline:none;background:#fff}
.cat input:disabled{background:var(--paper);opacity:.8}
.entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:2px solid var(--ink);position:relative;background:#fff}
.entry:first-of-type{border-top:0}
.entry .who{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.entry .ans{font-size:21px;font-weight:800;line-height:1.15;word-break:break-word}
.entry .grow{flex:1;min-width:0}
.badge{flex:none;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-weight:800;font-size:15px;text-align:center;min-width:44px}
.b-unique{background:var(--a3);color:var(--on-a3)}
.b-double{background:var(--a2);color:var(--on-a2);transform:rotate(-4deg)}
.b-zero{background:var(--paper)}
.entry.dim .ans{text-decoration:line-through;opacity:.5}
.entry.flag{background:var(--a2);color:var(--on-a2)}
.stamp{display:inline-block;font-family:var(--marker);font-size:15px;padding:0 8px;border:2px solid currentColor;border-radius:8px;transform:rotate(-4deg);margin-top:3px}
.stamp.good{color:var(--good)}.stamp.bad{color:var(--bad)}
.challenge-btn{flex:none;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;font-size:13px;padding:6px 8px;cursor:pointer}
.challenge-btn.arm{background:var(--bad);color:var(--on-bad)}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:var(--bw) solid var(--ink)}
.hostbar .inner{max-width:528px;margin:0 auto}
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--ink);color:var(--on-ink);overflow-y:auto}
.overlay .art{position:relative;flex:none;height:38vh;min-height:220px;border-bottom:4px solid var(--paper);background-size:240%}
.overlay .art::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:.18}
.overlay .body{flex:1;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.council-tag{position:absolute;left:14px;top:14px;z-index:2;font-family:var(--marker);font-size:30px;background:var(--a1);color:var(--on-a1);border:3px solid var(--ink);padding:2px 14px;border-radius:12px;transform:rotate(-4deg)}
.shout{font-size:clamp(40px,12vw,64px);line-height:.92;font-weight:800;letter-spacing:-.03em;margin:0;word-break:break-word}
.vote-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vote-row .btn{min-height:84px;font-size:24px;border-color:var(--paper);box-shadow:4px 4px 0 var(--paper)}
.btn.good{background:var(--good);color:var(--on-good)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.btn.chosen{outline:5px solid var(--a2);outline-offset:3px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nums button{aspect-ratio:1;border:3px solid var(--paper);border-radius:16px;background:var(--a5);color:var(--on-a5);font-size:30px;font-weight:800;cursor:pointer}
.lb{position:fixed;right:12px;top:62px;z-index:40;width:min(320px,calc(100vw - 24px));background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;max-height:70vh;overflow:auto}
.lb-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:2px dashed var(--ink)}
.lb-row:first-of-type{border-top:0}
.lb-row .pts{margin-left:auto;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center}
.banner{background:var(--a2);color:var(--on-a2);border-bottom:var(--bw) solid var(--ink);padding:8px 14px;font-size:14px;font-weight:700;text-align:center}
.center{text-align:center}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1) both}
.shake{animation:shake .5s both}
@keyframes slam{0%{transform:scale(1.8) rotate(10deg);opacity:0}100%{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.optc{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;background:var(--paper);cursor:pointer}
.optc.on{background:var(--a1);color:var(--on-a1)}
.mystery-tag{font-family:var(--display);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--on-ink);border-radius:6px;padding:2px 6px;vertical-align:middle}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:58px;height:34px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);position:relative;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .15s}
.switch:checked{background:var(--a4)}.switch:checked::after{left:27px}
.theme-opt{position:relative;width:96px;height:72px;border:var(--bw) solid var(--ink);border-radius:12px;overflow:hidden;cursor:pointer;flex:none;background:var(--paper);background-size:cover;background-position:center;padding:0}
.theme-opt.on{outline:4px solid var(--a1);outline-offset:2px}
.focus-pick{position:relative;width:100%;aspect-ratio:var(--ar,1.25);background-size:100% 100%;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;cursor:crosshair}
.focus-dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 3px var(--ink);pointer-events:none}
.swatches{display:flex;gap:6px}
.swatches span{width:30px;height:30px;border:2px solid var(--ink);border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin:6px 0 22px;min-height:300px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(40px);transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.5,.4,1)}
.pod.show{opacity:1;transform:none}
.pod .who{font-weight:800;font-size:17px;line-height:1.1;margin:6px 0 2px;word-break:break-word}
.pod .pts{font-weight:800;font-size:15px;margin-bottom:8px}
.pod .block{width:100%;border:var(--bw) solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:34px;font-weight:800;color:#141414}
.pod .trophy{transform:scale(.2) rotate(-20deg);transition:transform .5s cubic-bezier(.2,1.8,.4,1) .25s}
.pod.show .trophy{transform:none}
.pod.first.show .trophy{animation:bounce 1s ease-in-out .8s 3}
.podium-base{height:var(--bw);background:var(--ink);margin-top:-22px;margin-bottom:22px;border-radius:2px}
.drum{font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1;animation:pulse .45s ease-in-out infinite alternate;display:inline-block}
.fade-in{opacity:0;transition:opacity .6s ease}.fade-in.show{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:10px;height:15px;border:1.5px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-10px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-step],[data-letter],[data-rmcat],[data-theme],[data-ch],[data-chreal],[data-same],[data-vote],[data-num],[data-opt],[data-rmbot]'); if (!t) return;
  if (t.dataset.rmbot){ const g = H.g; delete g.players[t.dataset.rmbot]; delete g.scores[t.dataset.rmbot]; pushState(); return; }
  if (t.dataset.opt){ const c = H.g.cfg.cats, o = t.dataset.opt, i = c.findIndex(x => x.trim().toLowerCase() === o.toLowerCase());
    if (i >= 0){ if (c.length <= 1) return toast('Keep at least one category'); c.splice(i, 1); } else { if (c.length >= 10) return toast('Ten categories max'); c.push(o); }
    pushState(); return; }
  const act = t.dataset.act;
  if (t.dataset.step){ const id = t.dataset.step, d = +t.dataset.d, c = H.g.cfg;
    const lim = { rounds:[1,15,1], time:[30,240,15], voteTime:[10,60,5] }[id]; c[id] = Math.max(lim[0], Math.min(lim[1], c[id] + d * lim[2])); pushState(); return; }

  if (t.dataset.vote){ const a = G.active; if (!a) return; const vk = G.round + ':' + a.id; myVotes[vk] = t.dataset.vote === 'yes'; sendToHost({ t:'vote', id:a.id, accept:myVotes[vk] }); curOverlay = ''; renderOverlay(); return; }

    case 'solo': await becomeHost(false, true); { const g = H.g; addPlayer('bot-' + uid(), BOT_NAMES[0], true); addPlayer('bot-' + uid(), BOT_NAMES[1], true); pushState(); } break;
    case 'resume': becomeHost(true); break;
    case 'invite': inviteOpen = !inviteOpen; renderInvite(); break;

    case 'howjoin': toast(`Open this page and enter ${code}`); break;
    case 'addcat': { const c = H.g.cfg.cats; if (c.length >= 10) return toast('Ten categories max'); c.push('New category'); pushState(); setTimeout(() => { const f = document.querySelector(`[data-cati="${c.length - 1}"]`); if (f){ f.focus(); f.select(); } }, 50); break; }

    case 'lockin': myLocked = !myLocked; store.set(`ak_lock_${code}_${G.gid}_${me.pid}_${G.round}`, myLocked); sendAnswers(true); update(); break;
    case 'endearly': if (H.g.phase === 'answering'){ H.g.phase = 'locking'; H.g.endsAt = Date.now() + LOCK_GRACE; pushState(); } break;
    case 'endround': hostEndRound(); break;
    case 'lb': if (G.phase === 'reveal'){ lbOpen = !lbOpen; store.set('ak_lb', lbOpen); update(); } else lbPeek = !lbPeek;
      document.querySelectorAll('.topbar [data-act=lb]').forEach(b => b.textContent = lbLabel()); renderLB(); break;
    case 'skipguess': if (H.g.active && H.g.active.stage === 'tiebreak'){ resolveTie(0); pushState(); } break;

document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'jn' || e.target.id === 'jc')){ e.preventDefault(); const b = document.querySelector('[data-act=join]'); b && b.click(); } });

function constellation(n, filled){
  n = Math.max(1, n); const w = 300, h = 70, pts = [];
  for (let i = 0; i < n; i++){ const x = n === 1 ? w / 2 : 18 + i * (w - 36) / (n - 1), y = i % 2 ? 50 : 20 + ((i * 37) % 11); pts.push([x, y]); }
  const lines = pts.slice(1).map((p, i) => `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="currentColor" stroke-width="2.5"/>`).join('');
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i < filled ? 13 : 10}" fill="${i < filled ? 'var(--a5)' : 'var(--ink)'}" stroke="currentColor" stroke-width="3"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:360px;display:block;margin:0 auto" role="img" aria-label="${filled} of ${n} votes in">${lines}${dots}</svg>`;
}
function renderOverlay(){

  const key = [a.id, a.stage, voted, a.result].join(':');
  const owner = G.players[a.pid] || { name:'?' }, by = G.players[a.by] || { name:'Someone' };

    let body = '';
    if (a.kind === 'match'){
      const list = `<div class="stack" style="gap:8px">${a.items.map(it => { const p = G.players[it.pid] || { name:'?', color:0 };
        return `<div style="background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 12px"><div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px"><span class="pdot" style="background:${pcolor(p.color)}"></span>${esc(p.name)}</div><div style="font-size:24px;font-weight:800;line-height:1.15">${esc(it.text)}</div></div>`; }).join('')}</div>`;
      const mhead = `<div class="label" style="opacity:.8">${esc((G.players[a.by] || { name:'Someone' }).name)} thinks these ${esc(a.cat.toLowerCase())} answers are the same</div>` + list;
      if (a.stage === 'vote') body = mhead + `<div style="font-size:20px;font-weight:700">Are these the same answer? If yes, nobody gets points for them.</div>
        ${canVote ? (voted ? `<div class="sticker pop" style="color:var(--ink);align-self:flex-start">Vote cast. It stays secret.</div>` :
          `<div class="vote-row"><button class="btn bad" data-vote="yes">Same</button><button class="btn good" data-vote="no">Different</button></div>`) : `<div class="muted">The council is voting.</div>`}
        <div id="constel" style="color:var(--on-ink)"></div><div class="center" style="font-weight:800;font-size:22px" data-timer="vote"></div>
        ${isHost ? `<button class="btn small ghost" data-act="closevote" style="color:var(--on-ink);border-color:var(--on-ink);align-self:center">Close the vote now</button>` : ''}`;

      root.innerHTML = `<div class="overlay"><div class="art"><div class="council-tag">The council</div></div><div class="body">${body}</div></div>`;

      body = head + `<div class="center"><span class="sticker shake shout" style="display:inline-block;background:${good ? 'var(--good)' : 'var(--bad)'};color:${good ? 'var(--on-good)' : 'var(--on-bad)'};font-size:52px">${word}</span></div><div class="center" style="font-size:19px;font-weight:700">${detail}</div>`;
    }
    if (a.kind !== 'match') root.innerHTML = `<div class="overlay"><div class="art"><div class="council-tag">The council</div></div><div class="body">${body}</div></div>`;
  }
  const cs = $('#constel'); if (cs) cs.innerHTML = constellation(a.nVoters, a.nVoted) + `<div class="center" style="font-weight:700;margin-top:6px">${a.nVoted} of ${a.nVoters} voted</div>`;

function lbHTML(withHide){
  const live = G.phase === 'reveal' && G.reveal ? (() => { const o = {}; Object.keys(G.players).forEach(p => o[p] = 0); Object.values(G.reveal).forEach(l => l.forEach(e => { if (o[e.pid] != null) o[e.pid] += e.pts; })); return o; })() : {};

  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="label">Scores</span>${withHide ? '<button class="btn small ghost" data-act="lb" style="min-height:32px">Hide</button>' : ''}</div>

}

setInterval(() => {

(async function boot(){
  const q = new URLSearchParams(location.search);
  const img = await loadImage(THEMES[0].src).catch(() => null);
  if (img){ const t = { id:THEMES[0].id, tv:0, focus:THEMES[0].focus, palette:extractPalette(img) }; applyTheme(t); }
  const hc = (q.get('host') || '').toUpperCase(), saved = store.get('ak_hostgame', null);
  if (hc && saved && saved.code === hc){ becomeHost(true); return; }
